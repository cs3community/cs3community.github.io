<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A server federation protocol that lets users share files, folders, and other resources across different cloud platforms.">
  <title>OpenCloudMesh — About and History</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="_astro/Header.C0ZukeHO.css">

  <style>
    :root {
      --bg: #111315;
      --surface: #181b1f;
      --surface-hover: #1e2227;
      --text: #e7e9eb;
      --muted: #a8adb3;
      --heading: #ffffff;
      --link: #73bdf5;
      --link-hover: #9ed3fa;
      --border: #30343a;
      --code-bg: #20242a;
      --blockquote: #777e87;
      --max-width: 960px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      font-size: 16px;
      line-height: 1.7;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      color: var(--link-hover);
      text-decoration: underline;
    }

    /* ------------------------------------------------------------
       Content
       ------------------------------------------------------------ */

    main {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 58px 28px 80px;
    }

    #content {
      min-height: 300px;
    }

    #content > :first-child {
      margin-top: 0;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      color: var(--heading);
      line-height: 1.3;
      font-weight: 600;
      margin-top: 2em;
      margin-bottom: 0.7em;
    }

    h1 {
      font-size: 2.35rem;
      letter-spacing: -0.025em;
      margin-top: 0;
    }

    h2 {
      font-size: 1.8rem;
      padding-bottom: 0.35em;
      border-bottom: 1px solid var(--border);
    }

    h3 {
      font-size: 1.35rem;
    }

    h4 {
      font-size: 1.15rem;
    }

    p {
      margin: 0 0 1.15em;
    }

    ul,
    ol {
      margin-top: 0.5em;
      margin-bottom: 1.3em;
      padding-left: 1.7em;
    }

    li {
      margin: 0.35em 0;
    }

    li > p {
      margin-bottom: 0.5em;
    }

    strong {
      color: #fff;
      font-weight: 600;
    }

    em {
      color: #d7dbe0;
    }

    blockquote {
      margin: 1.5em 0;
      padding: 0.4em 1.2em;
      border-left: 3px solid var(--blockquote);
      color: var(--muted);
    }

    blockquote p:last-child {
      margin-bottom: 0;
    }

    code {
      padding: 0.15em 0.4em;
      border-radius: 4px;
      background: var(--code-bg);
      color: #e1e5e9;
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;
      font-size: 0.9em;
    }

    pre {
      overflow-x: auto;
      margin: 1.5em 0;
      padding: 1em 1.2em;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--code-bg);
    }

    pre code {
      padding: 0;
      background: transparent;
      font-size: 0.9em;
    }

    hr {
      height: 1px;
      margin: 2.5em 0;
      border: 0;
      background: var(--border);
    }

    img {
      max-width: 100%;
      height: auto;
    }

    table {
      width: 100%;
      margin: 1.5em 0;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 0.65em 0.8em;
      border: 1px solid var(--border);
      text-align: left;
    }

    th {
      color: var(--heading);
      background: var(--surface);
    }

    /* ------------------------------------------------------------
       Loading / error state
       ------------------------------------------------------------ */

    .status {
      color: var(--muted);
    }

    .error {
      padding: 1em 1.2em;
      border: 1px solid #59383c;
      border-radius: 6px;
      background: #211719;
      color: #e6b8bc;
    }

    @media (max-width: 700px) {
      main {
        padding: 42px 20px 60px;
      }

      h1 {
        font-size: 2rem;
      }

      h2 {
        font-size: 1.55rem;
      }
    }
  </style>
</head>

<body>

  <header id="site-header" class="fixed top-0 left-0 right-0 z-50 bg-gray-900/80 border-b border-gray-800 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-6 flex items-center justify-between h-16">
      <a href="/" class="flex items-center gap-3 group" aria-label="CS3 Community home">
        <img src="logos/orgs/cs3.png" alt="CS3 Community" class="h-10 w-10 transition-opacity group-hover:opacity-80"> <span class="mr-4">Community</span>
      </a> <span class="mx-3 text-gray-500">|</span> <a href="/ocm"><img src="logos/brand/ocm-text-horizontal.svg" alt="OpenCloudMesh" class="h-40 w-40 ml-2 transition-opacity group-hover:opacity-80" style="filter: brightness(0) invert(1);"></a>
      <nav class="hidden md:flex items-center justify-end gap-8 flex-1" aria-label="Main navigation"></nav>
      <button id="mobile-menu-btn" class="md:hidden flex items-center justify-center w-10 h-10 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 transition-colors" aria-label="Toggle menu" aria-expanded="false">
        <svg id="hamburger-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <svg id="close-icon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
    <div id="mobile-menu" class="hidden md:hidden bg-gray-950/95 backdrop-blur-lg border-t border-white/10">
      <nav class="max-w-7xl mx-auto px-6 py-4 flex flex-col gap-3" aria-label="Mobile navigation"></nav>
    </div>
  </header>

  <main>
    <article id="content">
      <p class="status">Loading history…</p>
    </article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@16.3.0/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.7/dist/purify.min.js"></script>

  <script>
    const MARKDOWN_URL =
      "https://raw.githubusercontent.com/cs3org/OCM-API/develop/HISTORY.md";

    const GITHUB_BASE =
      "https://github.com/cs3org/OCM-API/blob/develop/";

    const RAW_BASE =
      "https://raw.githubusercontent.com/cs3org/OCM-API/develop/";

    async function loadHistory() {
      const content = document.getElementById("content");

      try {
        const response = await fetch(MARKDOWN_URL, {
          cache: "no-cache"
        });

        if (!response.ok) {
          throw new Error(
            `GitHub returned HTTP ${response.status}`
          );
        }

        const markdown = await response.text();

        /*
         * Resolve relative Markdown links and images against the
         * original GitHub repository before rendering.
         */
        const renderer = new marked.Renderer();

        renderer.link = function ({ href, title, tokens }) {
          const resolvedHref = resolveLink(href);

          const titleAttribute = title
            ? ` title="${escapeAttribute(title)}"`
            : "";

          return `<a href="${escapeAttribute(resolvedHref)}"${titleAttribute}>${this.parser.parseInline(tokens)}</a>`;
        };

        renderer.image = function ({ href, title, text }) {
          const resolvedSrc = resolveImage(href);

          const titleAttribute = title
            ? ` title="${escapeAttribute(title)}"`
            : "";

          return `<img src="${escapeAttribute(resolvedSrc)}" alt="${escapeAttribute(text || "")}"${titleAttribute}>`;
        };

        marked.setOptions({
          renderer,
          gfm: true,
          breaks: false
        });

        const rendered = marked.parse(markdown);

        content.innerHTML = DOMPurify.sanitize(rendered, {
          USE_PROFILES: {
            html: true
          }
        });

        /*
         * All Markdown links intentionally remain same-tab.
         * No target="_blank" is added.
         */
        content.querySelectorAll("a").forEach((link) => {
          link.removeAttribute("target");
          link.removeAttribute("rel");
        });

      } catch (error) {
        console.error("Unable to load HISTORY.md:", error);

        content.innerHTML = `
          <div class="error">
            <strong>Unable to load the OpenCloudMesh history.</strong>
            <p>
              The history could not be fetched from GitHub.
              Please try again later.
            </p>
          </div>
        `;
      }
    }

    function resolveLink(href) {
      if (!href) {
        return href;
      }

      /*
       * Leave anchors, mailto:, tel:, and fully-qualified URLs alone.
       */
      if (
        href.startsWith("#") ||
        href.startsWith("mailto:") ||
        href.startsWith("tel:") ||
        /^[a-z][a-z0-9+.-]*:/i.test(href)
      ) {
        return href;
      }

      return new URL(href, GITHUB_BASE).href;
    }

    function resolveImage(href) {
      if (!href) {
        return href;
      }

      if (
        href.startsWith("data:") ||
        /^[a-z][a-z0-9+.-]*:/i.test(href)
      ) {
        return href;
      }

      return new URL(href, RAW_BASE).href;
    }

    function escapeAttribute(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    loadHistory();
  </script>

</body>
</html>
