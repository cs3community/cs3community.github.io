# CS3 conference history. One [[conferences]] entry per year.
#
# Required on every entry:
#   year      - int. The conference is featured at the top of the homepage
#               while year == the current calendar year.
#   city      - string.
#   country   - ISO 2-letter code, or "" for a virtual/online edition.
#   organizer - string, e.g. "University of Oslo".
#   website   - URL, always shown as a link.
#   image     - filename under static/images/conferences/.
#
# Optional, add only when you have a real value:
#   programme - URL to the programme/timetable.
#   doi       - Zenodo DOI (just the id, e.g. "10.5281/zenodo.44783"),
#               renders a DOI badge. Usually only past conferences have one.
#
# Optional, only meaningful for the entry matching the current year (the
# featured one) - drop them once no longer relevant, no need to keep stale
# values around:
#   start_date, end_date - real TOML dates (YYYY-MM-DD). Used to build the
#               displayed date range and to decide when Register/Abstract
#               should stop being shown.
#   register  - URL, shown until end_date passes (and, if
#               timeline.registration_open is set, only from that date on).
#   abstract  - URL to the abstract submission form, shown only during
#               [conferences.timeline]'s abstract_open..abstract_close
#               window; programme is shown in its place otherwise.
#   [conferences.timeline]
#     abstract_open, abstract_close - TOML dates bounding the Abstract link.
#     registration_open             - TOML date; Register hidden before it.
#
# Optional, for the organizer/sponsor/participant logo strip:
#   organizers, sponsors, participants - arrays of slugs defined in
#               data/partners.toml. Leave unset/empty until real logos
#               exist for that year.
#   logo_strip_image - filename under static/images/, shown instead as a
#               flat fallback image as long as the three arrays above are
#               empty.

