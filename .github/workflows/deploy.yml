name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}
  schedule:
    # Daily, off-peak UTC. Only actually rebuilds when check_schedule.py
    # finds a relevant date in data/conferences.toml - see that script for
    # why a static cron can't target exact conference milestones itself.
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether a scheduled run needs to build
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/check_schedule.py
          fi

      - uses: actions/setup-go@v5
        if: steps.check.outputs.should_build == 'true'
        with:
          go-version: "1.25"

      - uses: peaceiris/actions-hugo@v3
        if: steps.check.outputs.should_build == 'true'
        with:
          hugo-version: "0.163.1"
          extended: true

      - name: Build
        if: steps.check.outputs.should_build == 'true'
        run: hugo --minify --gc

      - uses: actions/configure-pages@v5
        if: steps.check.outputs.should_build == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.should_build == 'true'
        with:
          path: ./public

  deploy:
    needs: build
    if: needs.build.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
